<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voice Vault — Admin Panel</title>
<style>
*,:after,:before{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;
  --card:rgba(22,22,30,0.95);
  --card2:rgba(30,30,42,0.7);
  --border:rgba(255,255,255,0.06);
  --border2:rgba(255,255,255,0.1);
  --text:#f0f0f5;
  --text2:rgba(255,255,255,0.5);
  --text3:rgba(255,255,255,0.3);
  --accent:#6c5ce7;
  --accent2:#a29bfe;
  --accent3:#fd79a8;
  --green:#00b894;
  --green2:#55efc4;
  --red:#e17055;
  --red2:#fab1a0;
  --orange:#fdcb6e;
  --radius:16px;
  --radius-sm:10px;
  --radius-xs:6px;
  --shadow:0 8px 32px rgba(0,0,0,0.4);
  --glow:0 0 40px rgba(108,92,231,0.15);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle at 30% 20%,rgba(108,92,231,0.08) 0%,transparent 50%),
             radial-gradient(circle at 70% 80%,rgba(253,121,168,0.05) 0%,transparent 50%);
  pointer-events:none;
  z-index:0;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(10,10,15,0.8);
  backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  border-bottom:1px solid var(--border);
  padding:0 24px;
}
.header-inner{
  max-width:960px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 0 14px;
}
.header-left{
  display:flex;
  align-items:center;
  gap:14px;
}
.header-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 12px rgba(108,92,231,0.3);
  flex-shrink:0;
}
.header-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.header h1{
  font-size:18px;
  font-weight:700;
  letter-spacing:-0.3px;
  background:linear-gradient(135deg,var(--text),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.header-sub{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:2px;
  font-size:12px;
  color:var(--text2);
}
.header-sub .dot{width:3px;height:3px;border-radius:50%;background:var(--text3)}
.stat-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 10px;
  border-radius:20px;
  background:var(--card2);
  border:1px solid var(--border);
  font-size:11px;
  color:var(--text2);
}
.stat-pill svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.stat-pill strong{color:var(--text);font-weight:600}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:8px 16px;
  border:none;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all .2s ease;
  -webkit-tap-highlight-color:transparent;
  position:relative;
  overflow:hidden;
  letter-spacing:0.2px;
}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn:active{transform:scale(0.96)}
.btn-refresh{
  background:linear-gradient(135deg,var(--accent),#5a4bd1);
  color:#fff;
  box-shadow:0 4px 16px rgba(108,92,231,0.25);
}
.btn-refresh:hover{box-shadow:0 6px 24px rgba(108,92,231,0.35)}
.btn-sm{
  padding:6px 12px;
  font-size:11px;
  border-radius:var(--radius-xs);
  letter-spacing:0.3px;
}
.btn-sm svg{width:13px;height:13px}
.btn-play{background:rgba(0,184,148,0.15);color:var(--green2);border:1px solid rgba(0,184,148,0.2)}
.btn-play:hover{background:rgba(0,184,148,0.25)}
.btn-stop{background:rgba(253,203,110,0.15);color:var(--orange);border:1px solid rgba(253,203,110,0.2)}
.btn-download{background:rgba(108,92,231,0.15);color:var(--accent2);border:1px solid rgba(108,92,231,0.2)}
.btn-download:hover{background:rgba(108,92,231,0.25)}
.btn-delete{background:rgba(225,112,85,0.12);color:var(--red2);border:1px solid rgba(225,112,85,0.15)}
.btn-delete:hover{background:rgba(225,112,85,0.2)}

#loading{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:100px 20px;
  color:var(--text2);
  font-size:14px;
  gap:16px;
}
.loader-ring{
  width:44px;
  height:44px;
  border-radius:50%;
  border:3px solid var(--border2);
  border-top-color:var(--accent);
  animation:spin .8s cubic-bezier(.6,.2,.4,.8) infinite;
  box-shadow:0 0 20px rgba(108,92,231,0.1);
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:13px;color:var(--text3);letter-spacing:0.5px;display:flex;align-items:center;gap:8px}
.loader-dots span{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--text3);animation:dotPulse 1.4s ease-in-out infinite}
.loader-dots span:nth-child(2){animation-delay:.2s}
.loader-dots span:nth-child(3){animation-delay:.4s}
@keyframes dotPulse{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}

#error{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:80px 20px;
  text-align:center;
}
#error svg{width:48px;height:48px;stroke:var(--red2);opacity:.6;margin-bottom:16px}
#error p{color:var(--text2);font-size:14px;margin-bottom:16px}
.retry-btn{
  background:rgba(225,112,85,0.12);
  color:var(--red2);
  border:1px solid rgba(225,112,85,0.2);
  padding:8px 20px;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:all .2s ease;
}
.retry-btn:hover{background:rgba(225,112,85,0.2)}

main{
  max-width:960px;
  margin:0 auto;
  padding:20px 16px 60px;
  position:relative;
  z-index:1;
}

.rec-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:12px;
  overflow:hidden;
  transition:all .3s ease;
  animation:fadeSlideIn .4s ease both;
  box-shadow:var(--shadow);
}
.rec-card:hover{border-color:var(--border2)}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.rec-top{
  display:flex;
  align-items:flex-start;
  gap:14px;
  padding:16px 18px 12px;
  cursor:pointer;
  user-select:none;
}
.user-badge{
  width:40px;
  height:40px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),#5a4bd1);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:14px;
  color:#fff;
  flex-shrink:0;
  box-shadow:0 4px 12px rgba(108,92,231,0.2);
  letter-spacing:0.5px;
}
.rec-info{flex:1;min-width:0}
.rec-user{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:4px;
}
.rec-user-name{
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.rec-user-badge{
  font-size:9px;
  padding:2px 7px;
  border-radius:10px;
  background:rgba(108,92,231,0.12);
  color:var(--accent2);
  font-weight:600;
  letter-spacing:0.3px;
  white-space:nowrap;
}
.rec-meta-row{
  display:flex;
  flex-wrap:wrap;
  gap:4px 14px;
}
.rec-meta-item{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  color:var(--text2);
}
.rec-meta-item svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.5;flex-shrink:0}
.rec-meta-item strong{color:var(--text);font-weight:600}

.rec-expand{
  overflow:hidden;
  max-height:0;
  transition:max-height .35s cubic-bezier(.4,0,.2,1);
}
.rec-expand.open{max-height:300px}
.rec-body{
  padding:0 18px 16px 72px;
}
.rec-player-wrap{
  margin-bottom:10px;
  background:var(--card2);
  border-radius:var(--radius-sm);
  padding:6px;
  border:1px solid var(--border);
}
.rec-player-wrap audio{
  width:100%;
  height:36px;
  display:block;
  border-radius:var(--radius-xs);
  outline:none;
}
.rec-player-wrap audio::-webkit-media-controls-panel{background:transparent}
.rec-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.rec-id-bar{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid var(--border);
}
.rec-id-bar svg{width:10px;height:10px;stroke:var(--text3);opacity:.5}
.rec-id-bar span{
  font-size:10px;
  font-family:'SF Mono','Cascadia Code','Courier New',monospace;
  color:var(--text3);
  word-break:break-all;
  line-height:1.3;
}

.empty-state{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:100px 20px;
  text-align:center;
}
.empty-state svg{width:64px;height:64px;stroke:var(--text3);opacity:.3;margin-bottom:16px}
.empty-state h3{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-state p{font-size:13px;color:var(--text3)}

.toast-container{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  z-index:999;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:center;
  pointer-events:none;
}
.toast{
  background:rgba(22,22,30,0.95);
  backdrop-filter:blur(12px);
  border:1px solid var(--border2);
  border-radius:var(--radius-sm);
  padding:10px 18px;
  font-size:13px;
  color:var(--text);
  display:inline-flex;
  align-items:center;
  gap:8px;
  pointer-events:auto;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
  animation:toastIn .3s ease both;
}
.toast svg{width:16px;height:16px;flex-shrink:0}
.toast.toast-error svg{stroke:var(--red2)}
.toast.toast-success svg{stroke:var(--green2)}
.toast.toast-info svg{stroke:var(--accent2)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(20px) scale(.95)}}

@media(max-width:500px){
  .header{padding:0 16px}
  .header-inner{padding:14px 0 12px}
  .header h1{font-size:16px}
  .rec-top{padding:14px 14px 10px}
  .rec-body{padding:0 14px 14px 64px}
  .user-badge{width:36px;height:36px;font-size:12px}
  main{padding:16px 12px 60px}
}

@media(prefers-color-scheme:light){
  :root{
    --bg:#f5f3ff;
    --card:rgba(255,255,255,0.95);
    --card2:rgba(245,243,255,0.8);
    --border:rgba(108,92,231,0.08);
    --border2:rgba(108,92,231,0.15);
    --text:#1a1a2e;
    --text2:rgba(26,26,46,0.55);
    --text3:rgba(26,26,46,0.3);
    --shadow:0 8px 32px rgba(108,92,231,0.08);
  }
  .header{background:rgba(245,243,255,0.85)}
  .toast{background:rgba(255,255,255,0.95);box-shadow:0 8px 32px rgba(108,92,231,0.12)}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-left">
      <div class="header-icon">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </div>
      <div>
        <h1>Voice Vault</h1>
        <div class="header-sub">
          <span id="count">—</span>
          <span class="dot"></span>
          <span class="stat-pill">
            <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
            <strong id="totalSize">—</strong>
          </span>
        </div>
      </div>
    </div>
    <button class="btn btn-refresh" onclick="loadData()">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
  </div>
</div>

<div id="loading">
  <div class="loader-ring"></div>
  <div class="loader-text">
    Loading vault
    <span class="loader-dots"><span></span><span></span><span></span></span>
  </div>
</div>

<div id="error">
  <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <p>Failed to load voice vault</p>
  <button class="retry-btn" onclick="loadData()">
    <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    Retry
  </button>
</div>

<div class="toast-container" id="toastContainer"></div>

<main id="list"></main>

<script>
var SERVER = 'https://yutube-com-pcu9.onrender.com';
var allRecordings = [];
var expandedMap = {};

function loadData(){
  var loadEl=document.getElementById('loading');
  var errEl=document.getElementById('error');
  var list=document.getElementById('list');
  loadEl.style.display='flex';
  errEl.style.display='none';
  list.innerHTML='';
  allRecordings=[];
  expandedMap={};
  fetch(SERVER+'/api/voices/admin/list-light')
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(d){loadEl.style.display='none';allRecordings=d;renderList(d)})
    .catch(function(e){console.error(e);loadEl.style.display='none';errEl.style.display='flex'})
}

function formatDur(s){
  if(s==null)return '—'
  var m=Math.floor(s/60),sec=Math.floor(s%60);
  return m+':'+(sec<10?'0':'')+sec
}

function formatSize(b){
  if(b==null)return '—'
  if(b<1024)return b+' B'
  if(b<1048576)return(b/1024).toFixed(1)+' KB'
  return(b/1048576).toFixed(1)+' MB'
}

function formatDate(d){
  if(!d)return '—'
  var dt=new Date(d)
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+' '+dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})
}

function getInitials(id){
  if(!id)return'?'
  return id.substring(0,2).toUpperCase()
}

function showToast(msg,type){
  var c=document.getElementById('toastContainer')
  var t=document.createElement('div')
  t.className='toast toast-'+type
  var icons={
    success:'<svg viewBox="0 0 24 24" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    error:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
  }
  t.innerHTML=(icons[type]||icons.info)+msg
  c.appendChild(t)
  setTimeout(function(){t.style.animation='toastOut .25s ease forwards';setTimeout(function(){t.remove()},250)},2500)
}

function toggleExpand(id){
  var el=document.getElementById('expand_'+id)
  if(!el)return
  expandedMap[id]=!expandedMap[id]
  el.classList.toggle('open')
}

function playAudio(id,btn){
  var player=document.getElementById('player_'+id)
  if(!player)return
  if(!player.paused){
    player.pause();player.currentTime=0
    if(btn)btn.innerHTML='<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>Play'
    return
  }
  var url=SERVER+'/api/voices/'+id+'/raw?t='+Date.now()
  player.src=url
  player.style.display='block'
  player.play().then(function(){
    if(btn)btn.innerHTML='<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>Stop'
    player.onended=function(){
      if(btn)btn.innerHTML='<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>Play'
    }
  }).catch(function(e){
    console.error(e)
    if(btn)btn.innerHTML='<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>Play'
  })
}

function downloadAudio(id){
  var a=document.createElement('a')
  a.href=SERVER+'/api/voices/'+id+'/raw'
  a.download='voice_'+id+'.webm'
  document.body.appendChild(a);a.click();document.body.removeChild(a)
  showToast('Download started','success')
}

function deleteAudio(id){
  showToast('Deleting...','info')
  fetch(SERVER+'/api/voices/'+id,{method:'DELETE'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(){
      allRecordings=allRecordings.filter(function(r){return r.id!==id})
      renderList(allRecordings)
      showToast('Deleted successfully','success')
    })
    .catch(function(e){showToast('Delete failed: '+e.message,'error')})
}

function getRecipients(r){
  var a=[]
  if(r.receiver_id)a.push(r.receiver_id)
  if(r.reply_to)a.push('reply:'+r.reply_to)
  return a.length?a.join(', '):'—'
}

function renderList(data){
  var list=document.getElementById('list')
  list.innerHTML=''
  if(!data||!data.length){
    list.innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24" fill="none"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg><h3>Vault is empty</h3><p>No voice recordings found</p></div>'
    document.getElementById('count').textContent='0 recordings'
    document.getElementById('totalSize').textContent='—'
    return
  }
  var totalSz=0,groups={}
  data.forEach(function(r){
    totalSz+=r.file_size||0
    var uid=r.user_id||'unknown'
    if(!groups[uid])groups[uid]=[]
    groups[uid].push(r)
  })
  document.getElementById('count').textContent=data.length+' recording'+(data.length!==1?'s':'')
  document.getElementById('totalSize').textContent=formatSize(totalSz)
  var idx=0
  Object.keys(groups).sort().forEach(function(uid){
    var recs=groups[uid]
    recs.forEach(function(r){
      var delay=idx*0.05
      var card=document.createElement('div')
      card.className='rec-card'
      card.style.animationDelay=delay+'s'
      var top=document.createElement('div')
      top.className='rec-top'
      top.onclick=function(){toggleExpand(r.id)}
      top.innerHTML=
        '<div class="user-badge">'+getInitials(uid)+'</div>'+
        '<div class="rec-info">'+
          '<div class="rec-user">'+
            '<span class="rec-user-name">'+escapeHtml(uid)+'</span>'+
            '<span class="rec-user-badge">'+(r.media_type||'audio').replace('audio/','').toUpperCase()+'</span>'+
          '</div>'+
          '<div class="rec-meta-row">'+
            '<span class="rec-meta-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><strong>'+formatDur(r.duration)+'</strong></span>'+
            '<span class="rec-meta-item"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><strong>'+formatSize(r.file_size)+'</strong></span>'+
            '<span class="rec-meta-item"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><strong>'+formatDate(r.created_at)+'</strong></span>'+
            (r.receiver_id?'<span class="rec-meta-item"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><strong>'+escapeHtml(r.receiver_id)+'</strong></span>':'')+
          '</div>'+
        '</div>'
      var expand=document.createElement('div')
      expand.className='rec-expand'
      expand.id='expand_'+r.id
      if(expandedMap[r.id])expand.classList.add('open')
      expand.innerHTML=
        '<div class="rec-body">'+
          '<div class="rec-player-wrap">'+
            '<audio id="player_'+r.id+'" style="display:none" controls preload="none"></audio>'+
          '</div>'+
          '<div class="rec-actions">'+
            '<button class="btn btn-sm btn-play" onclick="event.stopPropagation();playAudio(\''+r.id+'\',this)"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>Play</button>'+
            '<button class="btn btn-sm btn-download" onclick="event.stopPropagation();downloadAudio(\''+r.id+'\')"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download</button>'+
            '<button class="btn btn-sm btn-delete" onclick="event.stopPropagation();deleteAudio(\''+r.id+'\')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete</button>'+
          '</div>'+
          '<div class="rec-id-bar">'+
            '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'+
            '<span>'+r.id+'</span>'+
          '</div>'+
        '</div>'
      card.appendChild(top)
      card.appendChild(expand)
      list.appendChild(card)
      idx++
    })
  })
}

function escapeHtml(s){
  if(!s)return''
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}

loadData()
</script>
